# Build iOS na nuvem (sem Mac local) → TestFlight / App Store
# Docs: https://docs.codemagic.io/yaml-publishing/app-store-connect/
#
# Env no Codemagic UI → Environment variables (OBRIGATÓRIO estar NO GRUPO):
# 1) Variable name: DOTENV_B64
# 2) Variable value: base64 do arquivo .env (uma linha só)
# 3) Select group: digite bora-comer-env (cria o grupo) — NÃO deixe o grupo em branco
# 4) Marque Secure → Add
#
# Gerar o valor no PowerShell (na pasta do projeto):
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes((Resolve-Path .env))) | Set-Clipboard

workflows:
  ios-app-store:
    name: Bora Comer iOS → App Store
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      # Nome exato da chave no Codemagic (Integrations → Developer Portal)
      app_store_connect: BoraComer!
    environment:
      groups:
        - bora-comer-env
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.noctis.gourmetapp
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        # App Store Connect → App → Informações do app → Apple ID
        APP_STORE_APP_ID: "6799257054"
        CM_CERTIFICATE_PASSWORD: $CM_CERTIFICATE_PASSWORD
      xcode: latest
      node: 22
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
      - name: Write .env
        script: |
          set -e
          ENV_FILE="$CM_BUILD_DIR/.env"
          echo "Diagnóstico (só nomes, sem valores):"
          env | cut -d= -f1 | grep -E '^(DOTENV|DOTENV_B64|VITE_)' | sort | sed 's/^/  - /' || true

          if [ -n "${DOTENV_B64:-}" ]; then
            echo "$DOTENV_B64" | base64 --decode > "$ENV_FILE"
            # normaliza CRLF do Windows
            sed -i 's/\r$//' "$ENV_FILE" 2>/dev/null || true
            echo "OK: .env a partir de DOTENV_B64 ($(wc -l < "$ENV_FILE") linhas)"
          elif [ -n "${DOTENV:-}" ]; then
            printf '%s\n' "$DOTENV" > "$ENV_FILE"
            sed -i 's/\r$//' "$ENV_FILE" 2>/dev/null || true
            echo "OK: .env a partir de DOTENV ($(wc -l < "$ENV_FILE") linhas)"
          else
            echo "DOTENV/DOTENV_B64 vazios — tentando VITE_* do grupo"
            : > "$ENV_FILE"
            for key in \
              VITE_FIREBASE_API_KEY \
              VITE_FIREBASE_AUTH_DOMAIN \
              VITE_FIREBASE_PROJECT_ID \
              VITE_FIREBASE_STORAGE_BUCKET \
              VITE_FIREBASE_MESSAGING_SENDER_ID \
              VITE_FIREBASE_APP_ID \
              VITE_OPENAI_API_KEY \
              VITE_STRIPE_PUBLISHABLE_KEY \
              VITE_APP_URL
            do
              eval "val=\${$key:-}"
              if [ -n "$val" ]; then
                printf '%s=%s\n' "$key" "$val" >> "$ENV_FILE"
              fi
            done
            echo "OK: .env gerado ($(wc -l < "$ENV_FILE") linhas)"
          fi

          if [ ! -s "$ENV_FILE" ]; then
            echo "ERROR: grupo bora-comer-env sem variáveis úteis." >&2
            echo "As variáveis DEVEM ser criadas COM o grupo selecionado (Select group = bora-comer-env)." >&2
            echo "Use DOTENV_B64 (base64 do .env, uma linha) + Secure + Add." >&2
            exit 1
          fi
          if ! grep -q '^VITE_FIREBASE_API_KEY=' "$ENV_FILE" || ! grep -q '^VITE_FIREBASE_PROJECT_ID=' "$ENV_FILE"; then
            echo "ERROR: faltam VITE_FIREBASE_API_KEY ou VITE_FIREBASE_PROJECT_ID no .env" >&2
            exit 1
          fi
          echo "Chaves presentes:"
          cut -d= -f1 "$ENV_FILE" | sed 's/^/  - /'
      - name: Build web + sync Capacitor (iOS)
        script: |
          npm run build:capacitor
          npx cap sync ios
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR/ios/App
          agvtool new-version -all $(($BUILD_NUMBER))
      - name: Build IPA
        script: |
          cd $CM_BUILD_DIR/ios/App
          xcode-project build-ipa \
            --project App.xcodeproj \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - agulainnovate@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
